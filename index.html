<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="手幅取货">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>手幅取货</title>
<style>
  :root {
    --bg: #ffffff; --card: #ffffff; --ink: #1f1a1c; --muted: #8e868a; --line: #efe9ec; --soft: #f6f2f4;
    --accent: #e8466b; --accent-soft: #fde8ed;
    --ok: #23966a; --ok-soft: #e2f4ec;
    --warn: #c06a00; --warn-soft: #fff1d6;
    --due: #d6336c; --due-soft: #ffe3ec;
    --shadow: 0 0 0 1px #f0eaed, 0 2px 10px rgba(80,40,60,.06);
    --round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 var(--round); -webkit-tap-highlight-color: transparent;
    font-variant-numeric: tabular-nums;
  }
  button, textarea { font: inherit; color: inherit; }

  /* ---------- 顶部 ---------- */
  header {
    position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    padding: calc(14px + env(safe-area-inset-top)) 16px 10px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .eyebrow { font-size: 13px; color: var(--muted); }
  .progress-num { font-size: 30px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; margin-top: 2px; }
  .progress-num small { font-size: 16px; font-weight: 600; color: var(--muted); }
  .prog-sub { display: block; font-size: 13px; font-weight: 600; letter-spacing: 0; color: var(--muted); margin-top: 2px; }
  .bar { height: 6px; border-radius: 3px; background: var(--soft); margin-top: 10px; overflow: hidden; display: flex; }
  .bar i { display: block; height: 100%; transition: width .3s; }
  .bar .b-ok { background: var(--ok); }
  .bar .b-part { background: #f5b335; }
  .who {
    display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 12px;
    border-radius: 999px; background: var(--card); box-shadow: var(--shadow);
    font-size: 13px; color: var(--muted); white-space: nowrap;
  }
  .who input {
    width: 56px; border: 0; outline: none; background: var(--soft); color: var(--ink);
    border-radius: 999px; padding: 4px 10px; font: 600 14px var(--round); text-align: center;
  }
  .top-r { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .stats-btn {
    border: 0; padding: 6px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent);
    font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  .search { position: relative; margin-top: 14px; }
  .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .search input {
    width: 100%; padding: 14px 14px 14px 44px; font: 17px var(--round);
    border: 1.5px solid transparent; border-radius: 14px; background: var(--card); color: var(--ink);
    box-shadow: var(--shadow); outline: none; -webkit-appearance: none;
  }
  .search input:focus { border-color: var(--accent); }
  .seg { display: flex; gap: 4px; margin-top: 12px; padding: 4px; background: var(--soft); border-radius: 12px; }
  .seg button {
    flex: 1; padding: 6px 0; border: 0; border-radius: 9px; background: none; cursor: pointer;
    font-size: 14px; color: var(--muted); white-space: nowrap;
  }
  .seg button b { font-weight: 700; margin-left: 2px; }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); font-weight: 600; }

  /* ---------- 订单列表 ---------- */
  main { padding: 6px 16px 48px; }
  .order {
    position: relative; display: block; width: 100%; text-align: left; margin-top: 10px;
    padding: 14px 14px 14px 18px; border: 0; border-radius: 16px;
    background: var(--card); box-shadow: var(--shadow); cursor: pointer; overflow: hidden;
  }
  .order::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); }
  .order.part::before { background: #f5b335; }
  .order.done::before { background: var(--ok); }
  .order:active { transform: scale(.99); }
  .order-head { display: flex; align-items: baseline; gap: 8px; }
  .oid { font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
  .oname { font-size: 15px; color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { flex: none; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; }
  .t-none { background: var(--accent-soft); color: var(--accent); }
  .t-part { background: var(--warn-soft); color: var(--warn); }
  .t-done { background: var(--ok-soft); color: var(--ok); }
  .t-due  { background: var(--due); color: #fff; }
  .lines { margin-top: 4px; font-size: 13px; display: grid; gap: 2px; }
  .lines .money { color: var(--muted); }
  .lines .money b { color: var(--ink); font-weight: 700; }
  .lines .left { color: var(--warn); font-weight: 600; }
  .lines .nt { color: var(--muted); }
  .minis { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .mini { position: relative; width: 48px; height: 48px; }
  .mini .ph { border-radius: 10px; font-size: 10px; }
  .mini.got .ph { opacity: .3; filter: grayscale(1); }
  .mini.half .ph { outline: 2px solid #f5b335; outline-offset: 1px; }
  .mini .n {
    position: absolute; right: -6px; top: -6px; min-width: 19px; height: 19px; padding: 0 5px;
    border-radius: 10px; background: var(--ink); color: #fff; border: 2px solid var(--card);
    font-size: 11px; font-weight: 700; display: grid; place-items: center; line-height: 1;
  }
  .mini.got .n { background: var(--ok); }
  .mini.half .n { background: #e89a00; }
  .order.done { box-shadow: 0 0 0 1px var(--line); }
  .order.done .oid, .order.done .oname { opacity: .5; }
  .dhead {
    display: flex; justify-content: space-between; align-items: baseline;
    margin: 20px 4px 2px; font-size: 15px; font-weight: 800;
  }
  .ihead { margin: 10px 4px 0; font-size: 13px; font-weight: 700; color: var(--accent); }
  .dhead span { font-size: 13px; font-weight: 600; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 56px 0; }
  .foot { text-align: center; margin-top: 28px; }
  .link { background: none; border: 0; color: var(--muted); font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

  /* ---------- 商品图（无图时显示色块） ---------- */
  .ph {
    position: relative; display: grid; place-items: center; width: 100%; height: 100%;
    overflow: hidden; text-align: center; padding: 6px; line-height: 1.2; font-weight: 700;
    background: repeating-linear-gradient(135deg, transparent 0 10px, rgba(255,255,255,.22) 10px 20px), var(--c1);
    color: var(--c2);
  }
  .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  /* ---------- 订单详情 ---------- */
  .mask {
    position: fixed; inset: 0; z-index: 10; background: rgba(30,15,20,.38);
    display: flex; align-items: flex-end; justify-content: center; animation: fade .18s ease-out;
  }
  .mask[hidden], .viewer[hidden] { display: none; }
  .sheet {
    width: 100%; max-width: 640px; max-height: 94vh; display: flex; flex-direction: column;
    background: var(--bg); border-radius: 22px 22px 0 0; animation: up .22s ease-out;
  }
  .sheet-scroll { overflow-y: auto; padding: 10px 16px 20px; }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 10px auto 4px; flex: none; }
  .s-head { display: flex; align-items: flex-start; gap: 12px; }
  .s-head h2 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
  .s-head .sub { color: var(--muted); font-size: 15px; margin-top: 2px; }
  .x {
    margin-left: auto; flex: none; width: 34px; height: 34px; border-radius: 50%; border: 0;
    background: var(--soft); color: var(--muted); font-size: 18px; cursor: pointer;
  }

  .boxes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .box { border-radius: 14px; padding: 12px 14px; background: var(--soft); }
  .box .k { font-size: 12px; color: var(--muted); }
  .box .v { font-size: 22px; font-weight: 800; margin-top: 2px; }
  .box .v small { font-size: 13px; font-weight: 600; color: var(--muted); }
  .box.due { background: var(--due-soft); }
  .box.due .k, .box.due .v { color: var(--due); }
  .box.paid .v { color: var(--ok); }
  .paycard.slim { padding: 12px 14px; }
  .paycard.slim .pay-status { margin-top: 0; font-size: 16px; }
  .pay-top .k.need { color: var(--due); font-weight: 700; font-size: 14px; }
  .who-line { color: var(--muted); }
  .date { color: var(--ink); font-weight: 600; }
  .pt { font-weight: 700; }
  .pt-ok { color: var(--ok); }
  .pt-due { color: var(--due); }
  .dup {
    margin-top: 10px; padding: 10px 12px; border-radius: 12px; font-size: 14px; font-weight: 600;
    background: var(--warn-soft); color: var(--warn);
  }
  .paycard { margin-top: 14px; border-radius: 16px; padding: 14px; background: var(--soft); }

  /* ---------- 韩中对照（在韩国卖：韩文在前，中文在后，一样大小） ---------- */
  .lb { display: block; }
  .catko { display: block; margin-top: 1px; color: var(--accent); }
  .seg button .lb { line-height: 1.25; }

  /* ---------- 商品统计 ---------- */
  .seg.dates { overflow-x: auto; scrollbar-width: none; }
  .seg.dates::-webkit-scrollbar { display: none; }
  .seg.dates button { flex: 1 0 auto; padding: 7px 12px; }
  .boxes.three { grid-template-columns: repeat(3, 1fr); }
  .box.okbox .v { color: var(--ok); }
  .box.stotal { margin-top: 10px; }
  .box.stotal .k.warn { color: var(--warn); margin-top: 4px; }
  .box.leftbox .v { color: var(--warn); }
  .srow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .srow .simg { flex: none; width: 52px; height: 52px; padding: 0; border: 0; border-radius: 10px; overflow: hidden; background: none; cursor: zoom-in; }
  .srow .ph { font-size: 9px; }
  .srow.done .simg { opacity: .45; filter: grayscale(.6); }
  .sinfo { flex: 1; min-width: 0; }
  .sname { font-size: 14px; font-weight: 700; line-height: 1.3; word-break: break-word; }
  .snums { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .snums b { color: var(--ink); }
  .sinfo .bar { height: 5px; margin-top: 6px; }
  .sleft { flex: none; min-width: 52px; text-align: right; font-size: 11px; color: var(--muted); }
  .sleft b { display: block; font-size: 22px; font-weight: 800; line-height: 1.1; color: var(--warn); }
  .srow.done .sleft b { color: var(--ok); font-size: 18px; }
  .srow.zero .sleft b { color: var(--muted); font-size: 15px; }
  .paycard.unpaid { background: var(--due-soft); }
  .paycard.ok { background: var(--ok-soft); }
  .pay-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .pay-top .k { font-size: 13px; color: var(--muted); }
  .paytype { display: flex; padding: 3px; border-radius: 10px; background: rgba(255,255,255,.7); }
  .paytype button {
    border: 0; background: none; padding: 6px 10px; border-radius: 8px; font-size: 13px; color: var(--muted); cursor: pointer;
  }
  .paytype button.on { background: var(--card); color: var(--ink); font-weight: 700; box-shadow: var(--shadow); }
  .amt { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .amt .krw { font-size: 26px; font-weight: 800; letter-spacing: -.01em; }
  .amt .cny { font-size: 20px; font-weight: 700; color: var(--muted); }
  .paycard.unpaid .amt .krw { color: var(--due); }
  .paycard.ok .amt .krw { color: var(--ok); }
  .pay-status { margin-top: 4px; font-size: 14px; font-weight: 600; }
  .paycard.unpaid .pay-status { color: var(--due); }
  .paycard.ok .pay-status { color: var(--ok); }
  .pay-status .link { font-weight: 400; margin-left: 6px; }
  .prows { margin-top: 10px; border-top: 1px dashed rgba(0,0,0,.12); padding-top: 8px; display: grid; gap: 4px; }
  .prow { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); }
  .prow b { color: var(--ink); font-weight: 600; white-space: nowrap; }
  .prow.warn, .prow.warn b { color: var(--warn); }
  .collect { margin-top: 12px; }
  .due-big { font-size: 15px; font-weight: 700; color: var(--due); }
  .mgroup { margin-top: 8px; }
  .mlabel { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .mlabel b { color: var(--ink); font-size: 14px; }
  .methods { display: flex; gap: 6px; }
  .methods button {
    flex: 1; padding: 14px 0; border: 0; border-radius: 10px; background: var(--card); cursor: pointer;
    font-size: 14px; font-weight: 700; box-shadow: var(--shadow);
  }
  .plist { margin-top: 8px; display: grid; gap: 2px; font-size: 13px; color: var(--ok); font-weight: 600; }
  .plist .link { margin-left: 6px; font-weight: 400; }
  .pay-status.muted { color: var(--muted); font-weight: 500; }
  .methods-hint { font-size: 12px; color: var(--due); margin-top: 10px; }
  .t-paid { background: var(--ok-soft); color: var(--ok); }
  .boxes.one { grid-template-columns: 1fr; }
  .paybtn {
    margin-top: 8px; width: 100%; padding: 8px; border: 0; border-radius: 10px; cursor: pointer;
    background: var(--due); color: #fff; font-size: 14px; font-weight: 700;
  }
  .box.left { background: var(--warn-soft); }
  .box.left .k, .box.left .v { color: var(--warn); }
  .box.alldone { background: var(--ok-soft); }
  .box.alldone .k, .box.alldone .v { color: var(--ok); }

  .alert {
    margin-top: 10px; padding: 10px 12px; border-radius: 12px; font-size: 14px; line-height: 1.5;
    background: var(--warn-soft); color: var(--warn);
  }
  .alert b { font-weight: 700; }
  .alert.note { background: #f3f0ff; color: #5b45c4; }
  .alert.err { background: var(--due-soft); color: var(--due); }
  .alert ul { margin: 6px 0 0; padding-left: 18px; }
  .alert li { margin: 2px 0; }
  .source { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .source b { color: var(--ink); font-weight: 600; }
  .btn + .btn { margin-top: 8px; }
  .btn.ghost { background: var(--soft); color: var(--ink); }

  .s-label { font-size: 13px; color: var(--muted); margin: 18px 2px 8px; display: flex; justify-content: space-between; gap: 8px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .pcard {
    position: relative; display: flex; flex-direction: column; border: 2px solid transparent; border-radius: 16px;
    background: var(--card); box-shadow: var(--shadow); text-align: left; cursor: pointer; overflow: hidden;
    transition: border-color .15s;
  }
  .pcard .pimg { aspect-ratio: 1 / 1; }
  .pcard .ph { font-size: 18px; }
  .pinfo { display: flex; align-items: baseline; gap: 6px; padding: 10px 12px 0; }
  .pinfo b { flex: 1; font-size: 14px; min-width: 0; line-height: 1.3; word-break: break-word; }
  .pinfo .q { font-size: 20px; font-weight: 800; }
  .spec { padding: 0 12px; font-size: 12px; color: var(--muted); }
  .price { padding: 2px 12px 0; font-size: 12px; color: var(--muted); }
  .price b { color: var(--ink); font-weight: 700; }
  .pstate { padding: 6px 12px 10px; font-size: 13px; color: var(--muted); margin-top: auto; }
  .pcard.got { border-color: var(--ok); }
  .pcard.got .ph { filter: grayscale(.6); opacity: .45; }
  .pcard.got .pstate { color: var(--ok); font-weight: 600; }
  .pcard.half { border-color: #f5b335; }
  .pcard.half .pstate { color: var(--warn); font-weight: 600; }
  .stamp {
    position: absolute; left: 50%; top: 32%; transform: translate(-50%,-50%) rotate(-8deg);
    min-width: 76px; height: 76px; padding: 0 10px; border-radius: 38px; background: var(--ok); color: #fff;
    display: grid; place-items: center; font-size: 15px; font-weight: 800; text-align: center; line-height: 1.15;
    box-shadow: 0 6px 18px rgba(0,0,0,.18); animation: pop .2s ease-out; pointer-events: none;
  }
  .stamp.half { background: #f5a300; }
  .zoom {
    position: absolute; right: 8px; top: 8px; width: 30px; height: 30px; border-radius: 50%; border: 0;
    background: rgba(0,0,0,.35); color: #fff; display: grid; place-items: center; cursor: zoom-in;
  }
  .stepper {
    display: flex; align-items: center; margin: 0 10px 10px; border-radius: 10px; background: var(--soft);
  }
  .stepper button {
    width: 40px; height: 36px; border: 0; background: none; font-size: 20px; font-weight: 700; cursor: pointer;
  }
  .stepper button:disabled { opacity: .25; cursor: default; }
  .stepper span { flex: 1; text-align: center; font-size: 13px; color: var(--muted); }
  .stepper span b { color: var(--ink); font-size: 15px; }

  .memo {
    width: 100%; min-height: 72px; resize: vertical; padding: 12px; border-radius: 12px;
    border: 1.5px solid var(--line); background: var(--card); outline: none; font-size: 15px;
  }
  .memo:focus { border-color: var(--accent); }
  .log { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .log li { display: flex; gap: 10px; padding: 7px 2px; border-bottom: 1px solid var(--line); }
  .log li:last-child { border-bottom: 0; }
  .log .t { color: var(--muted); flex: none; width: 92px; }
  .log .undo { color: var(--due); }

  .s-foot {
    flex: none; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line); background: var(--bg);
  }
  .btn {
    display: block; width: 100%; padding: 16px; border: 0; border-radius: 14px; cursor: pointer;
    background: var(--ink); color: #fff; font-size: 17px; font-weight: 700;
  }
  .btn.done { background: var(--ok-soft); color: var(--ok); }

  .viewer {
    position: fixed; inset: 0; z-index: 20; background: rgba(10,6,4,.88);
    display: grid; place-items: center; padding: 16px; animation: fade .15s;
  }
  .viewer .big { width: min(86vw, 440px); aspect-ratio: 1 / 1; border-radius: 20px; overflow: hidden; }
  .viewer .big .ph { font-size: 28px; }
  .viewer .full { display: block; max-width: min(92vw, 560px); max-height: 76vh; border-radius: 16px; }
  .viewer p { color: #fff; text-align: center; font-size: 18px; font-weight: 700; margin: 14px 0 0; }
  .viewer small { font-size: 14px; font-weight: 500; opacity: .75; }

  .btn.finish { background: var(--ok); }
  .btn.finish.blocked { background: var(--due); }
  .nudge-tip { text-align: center; font-size: 14px; font-weight: 700; color: var(--due); margin-bottom: 8px; }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  .donelog { color: var(--ok); font-weight: 600; }
  .sync {
    display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 10px; padding: 8px 12px;
    border: 0; border-radius: 10px; background: var(--ok-soft); color: var(--ok);
    font-size: 13px; font-weight: 600; text-align: left; cursor: pointer;
  }
  .sync i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .sync span { flex: 1; }
  .sync em { flex: none; font-style: normal; font-weight: 500; opacity: .8; }
  .sync.warn { background: var(--warn-soft); color: var(--warn); }
  .sync.bad { background: var(--due-soft); color: var(--due); }
  .alert.offline { background: var(--warn-soft); color: var(--warn); margin-top: 12px; }
  .dup.clash { background: var(--due-soft); color: var(--due); }
  .clash-help { margin-top: 8px; font-size: 13px; }
  .alert .btn { margin-top: 8px; padding: 12px; font-size: 15px; }
  .voided { color: var(--muted); text-decoration: line-through; }
  .foot { line-height: 2.2; }
  .login {
    position: fixed; inset: 0; z-index: 40; background: var(--bg);
    display: grid; place-items: center; padding: 24px 16px;
  }
  .login[hidden] { display: none; }
  .login-card { width: 100%; max-width: 360px; text-align: center; }
  .login-card img { border-radius: 18px; }
  .login-card h2 { margin: 12px 0 4px; font-size: 24px; }
  .login-card p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  .login-card label { display: block; text-align: left; font-size: 13px; color: var(--muted); margin-top: 12px; }
  .login-card input {
    display: block; width: 100%; margin-top: 6px; padding: 14px; font: 600 18px var(--round);

<script>
// ---------- 商品（之后可以和订单一起从 Excel 导入） ----------
// img: images 文件夹里的图片；spec: 尺寸/材质，用来区分长得像的款；krw / cny: 韩币 / 人民币单价（来自 ed95_stock.xlsx）
const DEMO_PRODUCTS = {
  'Black 手幅':          { img: 'images/black.jpg',                 spec: '60×30 黑色闪粉',    krw: 18000, cny: 105, c1: '#e5e5e5', c2: '#222' },
  'Cuddle 手幅':         { img: 'images/cuddle.jpg',                spec: '60×30 白色闪粉',    krw: 18000, cny: 105, c1: '#ffd6e0', c2: '#b8264d' },
  'Sky Blue 手幅':       { img: 'images/skyblue.jpg',               spec: '60×30 白色反光',    krw: 18000, cny: 105, c1: '#cfe9ff', c2: '#1b5f99' },
  'Dawn 手幅':           { img: 'images/dawn.jpg',                  spec: '60×30 反光',        krw: 18000, cny: 105, c1: '#d3f0f7', c2: '#1b6f87' },
  'Bubblegum 团扇':      { img: 'images/bubblegum_uchiwa.jpg',      spec: '30×30 大团扇 粉闪', krw: 18000, cny: 105, c1: '#ffd6ec', c2: '#b02a7a' },
  'mini Bubblegum 团扇': { img: 'images/bubblegum_uchiwa_mini.jpg', spec: '10×10 小团扇 粉闪', krw: 10000, cny: 50, c1: '#ffd6ec', c2: '#b02a7a' },
  'mini Cuddle 挂件':    { img: 'images/curddle_mini.jpg',          spec: '12×6 手幅挂件',     krw: 10000, cny: 50, c1: '#ffd6e0', c2: '#b8264d' },
  'Pink 小团扇':         { img: 'images/pink_miniuchiwa.jpg',       spec: '10×10 小团扇',      krw: 10000, cny: 50, c1: '#ffd6e0', c2: '#b8264d' },
  'Sunshine 小团扇':     { img: 'images/sunshine.jpg',              spec: '10×10 小团扇 反光', krw: 10000, cny: 50, c1: '#ffecb8', c2: '#9a5a00' },
};

// ---------- 示例订单（和 ed95_stock.xlsx 的「订单」表一样的列，之后会换成 Excel 导入） ----------
// id: 内部编号（用 Excel 行号，所以同名的人不会被合并）
// name: 收件人 · twitter · email：三个都能搜
// pay: '提前转账' 或 '现场付款'（用什么付到现场才知道）；date: 现场日期（只用来显示，所有日期的订单放在一起）
const DEMO_ORDERS = [
  { id: 'r2',  name: '小鱼', twitter: '2231',       email: 'xxx1@gmail.com',  pay: '提前转账', date: '10/31', note: '',           items: [['Black 手幅', 1], ['Pink 小团扇', 1]] },
  { id: 'r3',  name: '阿橘', twitter: '8810',       email: 'xxx1@gmail.com',  pay: '提前转账', date: '11/01', note: '',           items: [['Bubblegum 团扇', 1]] },
  { id: 'r4',  name: 'momo', twitter: '0042',       email: 'xxx1@gmail.com',  pay: '提前转账', date: '10/30', note: '代取：晴天', items: [['Cuddle 手幅', 1], ['mini Cuddle 挂件', 2], ['Sunshine 小团扇', 1]] },
  { id: 'r5',  name: '晴天', twitter: '7765',       email: 'xxx1@gmail.com',  pay: '现场付款', date: '11/01', note: '',           items: [['Sky Blue 手幅', 1], ['Dawn 手幅', 1]] },
  { id: 'r6',  name: 'KK',   twitter: '3390',       email: 'xxx1@gmail.com',  pay: '提前转账', date: '10/31', note: '',           items: [['mini Bubblegum 团扇', 3]] },
  { id: 'r7',  name: '栗子', twitter: '1208',       email: 'xxx1@gmail.com',  pay: '现场付款', date: '11/01', note: '下午才到',   items: [['Bubblegum 团扇', 1], ['mini Bubblegum 团扇', 1]] },
  { id: 'r8',  name: '七七', twitter: '6634',       email: 'xxx1@gmail.com',  pay: '提前转账', date: '10/31', note: '',           items: [['Dawn 手幅', 1]] },
  { id: 'r9',  name: 'Luna', twitter: '9021',       email: 'xxx1@gmail.com',  pay: '现场付款', date: '11/01', note: '',           items: [['Black 手幅', 1], ['Sky Blue 手幅', 1], ['Sunshine 小团扇', 2]] },
  // 示例：和第一行同名的另一个人，演示同名时让客人自己选
  { id: 'r10', name: '小鱼', twitter: 'fish_0815',  email: 'fish0815@gmail.com', pay: '现场付款', date: '11/01', note: '',      items: [['Dawn 手幅', 1]] },
];
// ---------- 后台 ----------
// 还没接 Google 表格 / Firebase：先用 MockBackend 模拟后台（存在这台手机里），用来测试断网和补传。
// 以后换真的后台，只要实现同样的 push / pull 两个方法。
const sleep = ms => new Promise(r => setTimeout(r, ms));
const MockBackend = {
  name: '模拟后台（测试用）',
  key: 'hf_mock_server',
  offline: (() => { try { return localStorage.getItem('hf_mock_offline') === '1'; } catch (e) { return false; } })(),
  reset(events) { try { localStorage.setItem(this.key, JSON.stringify({ events })); } catch (e) {} },
  read() { try { return JSON.parse(localStorage.getItem(this.key)) || { events: [] }; } catch (e) { return { events: [] }; } },
  check() { if (this.offline || !navigator.onLine) throw new Error('没有网络'); },
  // 上传记录（重复上传同一条没关系，按编号去重）
  async push(events) {
    await sleep(250); this.check();
    const s = this.read(), have = new Set(s.events.map(e => e.eid));
    events.forEach(e => { if (!have.has(e.eid)) s.events.push(e); });
    this.reset(s.events);
  },
  // 拉取第 cursor 条以后的新记录
  async pull(cursor) {
    await sleep(250); this.check();
    const s = this.read();
    return { events: s.events.slice(cursor), cursor: s.events.length };
  },
};
// Google 表格后台：部署 Apps Script（google-apps-script.gs）后得到的「网页应用网址」填在这里。
// 空着 = 用示例数据和模拟后台。（测试时也可以在网址后面加 ?api=… 临时指定）
const SHEET_API = new URLSearchParams(location.search).get('api') ||
  'https://script.google.com/macros/s/AKfycby7ktqc-gsf36vkiJXBQD44ywp94aVLybQ_ZaH5f-of9_qeKMG8YjWPPqAVwGS2280/exec';

const GoogleBackend = {
  name: 'Google 表格',
  async call(params, body) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 15000);   // 信号很差时 15 秒没回应就当作没网
    try {
      const code = store.get('hf_code', '');
      const res = body
        // 用 text/plain 发，Google 的网页应用才不会拦下跨网站请求
        ? await fetch(SHEET_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                   body: JSON.stringify({ code, ...body }), signal: ctrl.signal })
        : await fetch(SHEET_API + (SHEET_API.includes('?') ? '&' : '?') + new URLSearchParams({ code, ...params }), { signal: ctrl.signal });
      const j = await res.json();
      if (j.error === 'code') throw Object.assign(new Error('访问码不对'), { badCode: true });
      if (j.error) throw new Error(j.error);
      return j;
    } finally {
      clearTimeout(timer);
    }
  },
  // 上传时顺便带上收件人、动作等文字，表格里看得懂
  async push(events) { await this.call(null, { events: events.map(e => ({ ...e, view: viewOf(e) })) }); },
  async pull(cursor) { const j = await this.call({ action: 'pull', cursor }); return { events: j.events, cursor: j.cursor }; },
};
const Backend = SHEET_API ? GoogleBackend : MockBackend;

// 一条记录在「取货记录」表里显示成什么
function viewOf(e) {
  const o = ORDERS.find(x => x.id === e.oid) || {};
  const v = { name: o.name || '', twitter: o.twitter || '' };
  if (e.type === 'pick') Object.assign(v, { action: e.d > 0 ? '取走' : '退回', item: e.n, qty: Math.abs(e.d) });
  else if (e.type === 'pay') Object.assign(v, { action: '收款', method: e.method, amount: e.cur === 'KRW' ? won(e.amount) : yuan(e.amount) });
  else if (e.type === 'done') Object.assign(v, { action: '完成交接', qty: e.d });
  else if (e.type === 'memo') Object.assign(v, { action: '备注', item: e.text });
  else if (e.type === 'void') {
    const r = book.events.find(x => x.eid === e.ref), rv = r ? viewOf(r) : {};
    Object.assign(v, { action: '撤销', item: r ? `撤销「${[rv.action, rv.item, rv.qty && '×' + rv.qty, rv.amount].filter(Boolean).join(' ')}」` : '' });
  }
  return v;
}

// 微信、支付宝收人民币；银行转账、现金收韩币
const METHODS = [
  { key: '微信', cur: 'CNY' }, { key: '支付宝', cur: 'CNY' },
  { key: '银行转账', cur: 'KRW' }, { key: '现金', cur: 'KRW' },
];

// ---------- 本地存储 ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
// 连了 Google 表格就用表格里的商品和订单（手机里存一份，断网也能用），否则用示例
const MODE = SHEET_API ? 'sheet:' + SHEET_API : 'demo';
let sheetCache = SHEET_API ? store.get('hf_sheet_cache', null) : null;
let PRODUCTS = sheetCache?.products || (SHEET_API ? {} : DEMO_PRODUCTS);
let ORDERS = sheetCache?.orders || (SHEET_API ? [] : DEMO_ORDERS);

// ---------- 记录本 ----------
// 每个操作都是一条记录，先存在手机里，有网再上传；所有手机的记录合在一起，算出现在的状态。
// { eid: 唯一编号, at: 时间, by: 核对人, dev: 设备, oid: 订单, type, ... }
//   pick: n 商品名, d 件数（正数 = 取走，负数 = 退回）
//   pay:  method 付款方式, cur 货币, amount 金额, krw / cny 抵了多少货款
//   done: d 本次交接的件数
//   memo: text 现场备注（以最新一条为准）
//   void: ref 撤销哪一条记录
const DEVICE = store.get('hf_device', null) || (() => {
  const d = Math.random().toString(36).slice(2, 8);
  store.set('hf_device', d);
  return d;
})();

// 示例：momo 提前转账、只取了一部分；栗子 现场付款、只取了一部分并只付了已取部分
function demoEvents() {
  const t = Date.now() - 50 * 60000;
  const e = (i, by, oid, type, f) => ({ eid: 'demo-' + i, at: t + i, by, dev: 'demo', oid, type, ...f });
  return [
    e(1, 'B', 'r4', 'pick', { n: 'Cuddle 手幅', d: 1 }),
    e(2, 'B', 'r4', 'pick', { n: 'mini Cuddle 挂件', d: 1 }),
    e(3, 'B', 'r4', 'memo', { text: '挂件现场只剩 1 个，剩下 1 个和团扇周日来拿' }),
    e(4, 'B', 'r5', 'pay', { method: '微信', cur: 'CNY', amount: 210, krw: 36000, cny: 210 }),
    e(5, 'A', 'r7', 'pick', { n: 'Bubblegum 团扇', d: 1 }),
    e(6, 'A', 'r7', 'pay', { method: '微信', cur: 'CNY', amount: 105, krw: 18000, cny: 105 }),
    e(7, 'A', 'r7', 'memo', { text: '小团扇明天来拿' }),
  ];
}
// book.events: 这台手机知道的所有记录（自己的 + 从后台拉下来的）
// book.sent:   已经上传到后台的记录编号；book.cursor: 后台记录拉到了第几条
const newBook = events => ({ events, sent: Object.fromEntries(events.map(e => [e.eid, true])), cursor: 0 });
let book = store.get('hf_book_v1', null);
if (!book || store.get('hf_mode', '') !== MODE) {   // 第一次用，或者换了数据来源：从头开始
  book = SHEET_API ? newBook([]) : newBook(demoEvents());
  if (!SHEET_API) MockBackend.reset(book.events);
  store.set('hf_mode', MODE);
}
const saveBook = () => store.set('hf_book_v1', book);

// 由记录算出当前状态
// data.picks:    { 订单: { 商品名: 已取件数 } }（按订单数量截断）
// data.raw:      { 订单: { 商品名: 记录加起来的件数 } }（可能超过订单数量 = 可能重复发了）
// data.payments: { 订单: [{ eid, method, cur, amount, krw, cny, at, by }] }
// data.logs:     { 订单: [显示用的记录] }；data.memos: { 订单: 现场备注 }
let data;
function rebuild() {
  const voids = book.events.filter(e => e.type === 'void');
  const voidIds = new Set(voids.map(e => e.eid));
  const undoneVoids = new Set(voids.filter(e => voidIds.has(e.ref)).map(e => e.ref));   // 撤销又被撤销 = 恢复
  const dead = new Set(voids.filter(e => !undoneVoids.has(e.eid) && !voidIds.has(e.ref)).map(e => e.ref));
  const qty = {};
  ORDERS.forEach(o => { qty[o.id] = Object.fromEntries(o.items); });

  data = { picks: {}, raw: {}, payments: {}, logs: {}, memos: {} };
  const evs = book.events.filter(e => e.type !== 'void').sort((a, b) => a.at - b.at || (a.eid < b.eid ? -1 : 1));
  for (const e of evs) {
    const gone = dead.has(e.eid), log = (data.logs[e.oid] ||= []);
    const base = { at: e.at, by: e.by, voided: gone };
    if (e.type === 'pick') {
      if (!gone) (data.raw[e.oid] ||= {})[e.n] = (data.raw[e.oid]?.[e.n] || 0) + e.d;
      log.push({ ...base, n: e.n, d: e.d });
    } else if (e.type === 'pay') {
      if (!gone) (data.payments[e.oid] ||= []).push({ eid: e.eid, method: e.method, cur: e.cur, amount: e.amount, krw: e.krw, cny: e.cny, at: e.at, by: e.by });
      log.push({ ...base, paid: e.method, cur: e.cur, amount: e.amount });
    } else if (e.type === 'done') {
      if (!gone) log.push({ ...base, done: e.d });
    } else if (e.type === 'memo') {
      if (!gone) { if (e.text) data.memos[e.oid] = e.text; else delete data.memos[e.oid]; }
    }
  }
  for (const oid in data.raw) {
    data.picks[oid] = {};
    for (const n in data.raw[oid]) data.picks[oid][n] = Math.max(0, Math.min(qty[oid]?.[n] ?? Infinity, data.raw[oid][n]));
  }
}

// 写一条新记录（在 act 里写的会被记下来，方便撤销）
let recording = null;
const whoAmI = () => $('#who').value.trim() || '?';
function emit(oid, type, fields) {
  const e = { eid: `${DEVICE}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`,
              at: Date.now(), by: whoAmI(), dev: DEVICE, oid, type, ...fields };
  book.events.push(e);
  if (recording) recording.push(e.eid);
  return e;
}
// 存好、重算、通知同步
function commit() { saveBook(); rebuild(); sync.kick(); }

let filter = 'all';
let openId = null;
let statsOpen = false, statsIdol = 'all', statsDate = 'all';   // 商品统计

// ---------- 同步 ----------
// 有改动马上试着上传；另外每 10 秒、网络恢复时各同步一次。失败了记录还在手机里，下次再传。
const sync = {
  busy: false,
  lastOk: store.get('hf_last_sync', 0),
  offlineSince: null,
  pending() { return book.events.filter(e => !book.sent[e.eid]).length; },
  kick() { clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), 200); renderSync(); },
  async run() {
    if (SHEET_API && !store.get('hf_code', '')) return;   // 还没登录
    if (this.busy) { this.again = true; return; }   // 正在同步：结束后马上再跑一次
    this.busy = true; this.again = false; renderSync();
    try {
      const out = book.events.filter(e => !book.sent[e.eid]);
      if (out.length) {
        await Backend.push(out);
        out.forEach(e => { book.sent[e.eid] = true; });
        saveBook();
      }
      const res = await Backend.pull(book.cursor || 0);
      const have = new Set(book.events.map(e => e.eid));
      let added = 0;
      res.events.forEach(e => {
        book.sent[e.eid] = true;
        if (!have.has(e.eid)) { book.events.push(e); added++; }
      });
      // 「取货记录」被清空了 = 新的一场：手机里已经上传过的旧记录也清掉（还没上传的保留）
      if (res.cursor === 0 && book.events.some(e => book.sent[e.eid])) {
        book.events = book.events.filter(e => !book.sent[e.eid]);
        book.sent = {}; book.cursor = 0; added = 1;
      }
      // 后台的记录比上次少了（有人删了「取货记录」的行）：从头再拉一遍，按编号去重
      else if (res.cursor < (book.cursor || 0)) { book.cursor = 0; this.again = true; }
      else book.cursor = res.cursor;
      saveBook();
      this.lastOk = Date.now(); store.set('hf_last_sync', this.lastOk);
      this.offlineSince = null;
      if (added) { rebuild(); refreshViews(); }
      if (SHEET_API && Date.now() - lastLoad > 60000) loadSheet();   // 每分钟看一次订单有没有改
    } catch (err) {
      if (err.badCode) showLogin('访问码已经改了，请输入新的访问码');
      else this.offlineSince ||= Date.now();
    }
    this.busy = false; renderSync();

const taken = (o, n) => data.picks[o.id]?.[n] || 0;
// 按件数算一组商品的韩币/人民币金额
function pair(o, count) {

  }, { krw: 0, cny: 0 });
}
function sum(o) {
  let qty = 0, got = 0;

  const T = pair(o, (n, c) => c);                          // 订单总额
  const G = pair(o, (n, c) => Math.min(taken(o, n), c));   // 已取商品的金额

          const last = (data.logs[o.id] || []).filter(l => l.n === n && l.d > 0 && !l.voided).pop();

            <button class="zoom" data-zoom="${esc(n)}" aria-label="放大">

      ${logs.length ? `
        <div class="s-label"><span>取货记录</span></div>
        <ul class="log">${logs.map(l => `<li>
          <span class="t">${time(l.at)} · ${esc(l.by)}</span>
          ${l.done !== undefined ? `<span class="donelog">✓ 完成交接（本次${l.done >= 0 ? '取走' : '退回'} ${Math.abs(l.done)} 件）</span>`
            : l.paid ? `<span class="${l.voided ? 'voided' : ''}">收到 ${l.cur === 'KRW' ? won(l.amount) : yuan(l.amount)}（${esc(l.paid)}）${l.voided ? '（已撤销）' : ''}</span>`
            : `<span class="${l.voided ? 'voided' : l.d < 0 ? 'undo' : ''}">${l.d > 0 ? '取走' : '退回'} ${esc(l.n)} ×${Math.abs(l.d)}${l.voided ? '（已撤销）' : ''}</span>`}
        </li>`).join('')}</ul>` : ''}
    </div>
    <div class="s-foot">${footer(o, m)}</div>`;
  $('.sheet-scroll').scrollTop = keepScroll;
}

function setTaken(o, n, k) {
  const c = o.items.find(([x]) => x === n)[1];
  k = Math.max(0, Math.min(c, k));
  const d = k - taken(o, n);
  if (d) emit(o.id, 'pick', { n, d });
}

let undoIds = null, toastTimer = null;
function act(msg, fn) {
  recording = [];
  fn();
  const ids = recording;
  recording = null;
  commit();
  if (ids.length) showToast(msg, ids);
}
function showToast(msg, ids = null) {
  undoIds = ids;
  $('#toast').innerHTML = `<span>${esc(msg)}</span>${ids ? '<button id="undo">撤销</button>' : ''}`;
  $('#toast').hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('#toast').hidden = true; undoIds = null; }, ids ? 6000 : 3000);
}
$('#toast').addEventListener('click', e => {
  if (!e.target.closest('#undo') || !undoIds) return;
  undoIds.slice().reverse().forEach(ref => {
    const r = book.events.find(x => x.eid === ref);
    if (r) emit(r.oid, 'void', { ref });
  });
  undoIds = null;
  commit();
  $('#toast').hidden = true;
  if (openId) renderSheet(); else renderList();
});

// 每款商品：所有订单里一共订了几件、已经取走几件（和取货页面用同一份记录，实时更新）
const idolOfName = n => n.includes(' · ') ? n.split(' · ')[0] : '';
function renderStats() {
  const dates = {};   // 有哪些现场日期：{ 1030: '10/30' }
  ORDERS.forEach(o => { const k = dateKeyOf(o); dates[k] ||= k === 9999 ? '没写日期' : o.date; });
  const dateKeys = Object.keys(dates).map(Number).sort((a, b) => a - b);
  if (statsDate !== 'all' && !dates[statsDate]) statsDate = 'all';
  const per = {};
  // 选了日期就只列那天有人订的款
  if (statsDate === 'all') Object.keys(PRODUCTS).forEach(n => { per[n] = { qty: 0, got: 0 }; });
  ORDERS.filter(o => statsDate === 'all' || dateKeyOf(o) === statsDate).forEach(o => o.items.forEach(([n, c]) => {
    const s = per[n] ||= { qty: 0, got: 0 };
    s.qty += c; s.got += Math.min(taken(o, n), c);
  }));
  const idolKey = i => { const k = IDOL_ORDER.indexOf(i); return k < 0 ? IDOL_ORDER.length : k; };
  const idols = [...new Set(Object.keys(per).map(idolOfName))].sort((a, b) => idolKey(a) - idolKey(b));
  if (statsIdol !== 'all' && !idols.includes(statsIdol)) statsIdol = 'all';
  const names = Object.keys(per)
    .map((n, i) => [n, i])
    .filter(([n]) => statsIdol === 'all' || idolOfName(n) === statsIdol)
    .sort((a, b) => idolKey(idolOfName(a[0])) - idolKey(idolOfName(b[0])) || per[b[0]].qty - per[a[0]].qty || a[1] - b[1])   // 同一偶像里订得多的在前
    .map(([n]) => n);
  const T = names.reduce((a, n) => ({ qty: a.qty + per[n].qty, got: a.got + per[n].got }), { qty: 0, got: 0 });
  const money = n => ({ krw: per[n].qty * (PRODUCTS[n]?.krw || 0), cny: per[n].qty * (PRODUCTS[n]?.cny || 0) });   // 订了几件 × 单价
  const M = names.reduce((a, n) => { const m = money(n); return { krw: a.krw + m.krw, cny: a.cny + m.cny }; }, { krw: 0, cny: 0 });
  const noPrice = names.filter(n => per[n].qty && !PRODUCTS[n]?.krw);
  const keepScroll = $('.sheet-scroll')?.scrollTop || 0;
  let lastIdol = null;

  $('#sheet').innerHTML = `
    <div class="grab"></div>
    <div class="sheet-scroll">
      <div class="s-head"><div><h2>商品统计</h2><div class="sub">${statsDate === 'all' ? '所有日期' : esc(dates[statsDate] === '没写日期' ? '没写日期' : '现场 ' + dates[statsDate])}的订单 · 实时更新</div></div>
        <button class="x" id="close" aria-label="关闭">✕</button></div>
      ${dateKeys.length > 1 ? `<div class="seg dates">${[['all', '全部日期'], ...dateKeys.map(k => [k, dates[k]])]
        .map(([k, t]) => `<button class="${statsDate === k ? 'on' : ''}" data-sd="${k}">${esc(t)}</button>`).join('')}</div>` : ''}
      ${idols.length > 1 ? `<div class="seg">${[['all', '全部'], ...idols.map(i => [i, i || '其他'])]
        .map(([k, t]) => `<button class="${statsIdol === k ? 'on' : ''}" data-si="${esc(k)}">${esc(t)}</button>`).join('')}</div>` : ''}
      <div class="boxes three">
        <div class="box"><div class="k">一共订了</div><div class="v">${T.qty}<small> 件</small></div></div>
        <div class="box okbox"><div class="k">已取</div><div class="v">${T.got}<small> 件</small></div></div>
        <div class="box leftbox"><div class="k">还剩</div><div class="v">${T.qty - T.got}<small> 件</small></div></div>
      </div>
      <div class="box stotal"><div class="k">订单总金额</div><div class="v">${won(M.krw)}<small> / ${yuan(M.cny)}</small></div>
        ${noPrice.length ? `<div class="k warn">${noPrice.length} 款没填价格，没算进去：${esc(noPrice.join('、'))}</div>` : ''}</div>
      ${names.map(n => {
        const s = per[n], left = s.qty - s.got, idol = idolOfName(n);
        const cls = !s.qty ? 'zero' : !left ? 'done' : '';
        let head = '';
        if (statsIdol === 'all' && idols.length > 1 && idol !== lastIdol) head = `<div class="ihead">${esc(idol || '其他')}</div>`;
        lastIdol = idol;
        return head + `<div class="srow ${cls}">
          <button class="simg" data-zoom="${esc(n)}" aria-label="放大">${ph(n)}</button>
          <div class="sinfo">
            <div class="sname">${esc(n)}</div>
            <div class="snums">订了 <b>${s.qty}</b> · 已取 <b>${s.got}</b>${s.qty && PRODUCTS[n]?.krw ? ` · ${both(money(n))}` : ''}</div>
            ${s.qty ? `<div class="bar"><i class="b-ok" style="width:${s.got / s.qty * 100}%"></i></div>` : ''}
          </div>
          <div class="sleft">${!s.qty ? '<b>—</b>还没人订' : !left ? '<b>✓</b>取完' : `<b>${left}</b>还剩`}</div>
        </div>`;
      }).join('') || `<div class="empty">还没有商品数据</div>`}
    </div>
    <div class="s-foot"><button class="btn ghost" id="close2">关闭</button></div>`;
  $('.sheet-scroll').scrollTop = keepScroll;

// ---------- 读 Google 表格 ----------
// 「商品」表：商品名 / 规格 / 韩币 / 人民币 / 图片；「订单」表：收件人 / twitter / email / 付款方式 / 现场日期 / 商品列… / 备注
const PALETTE = [['#ffd6e0', '#b8264d'], ['#ddd5ff', '#5634c4'], ['#cfe9ff', '#1b5f99'], ['#ffe8b8', '#9a5a00'], ['#d3f0f7', '#1b6f87'], ['#e5e5e5', '#222']];
const ORDER_COLS = {   // 按表头文字认列，顺序可以随便换
  name: /receiver|수령인|收件人|姓名|名字|昵称/i,
  twitter: /twitter|推特|트위터/i,
  email: /e-?mail|gmail|邮箱|이메일/i,
  pay: /付款|결제|payment/i,
  date: /日期|날짜|date/i,
  note: /备注|메모|note|memo/i,
};
const IGNORE_COL = /合计|total|序号|编号|预览|库存|转账信息|来源/i;   // 只是给人看的列
const cell = v => String(v ?? '').trim();
// 价格可能是数字，也可能是复制粘贴后变成的文字「₩18,000」「¥105」
const num = v => typeof v === 'number' ? v : Number(String(v ?? '').replace(/[^\d.]/g, '')) || 0;

// pr / or：「商品」「订单」两张表的内容（二维数组，第一行是表头）
function parseRows(pr, or) {
  const errors = [], warns = [];
  if (!pr.length) errors.push('找不到「商品」表，或者表是空的');
  if (!or.length) errors.push('找不到「订单」表，或者表是空的');
  if (errors.length) return { errors, warns };

  // 商品
  const ph = (pr[0] || []).map(cell);
  const col = re => ph.findIndex(h => re.test(h));
  const iName = col(/商品名|^商品$|^name$/i), iSpec = col(/规格|spec/i), iKrw = col(/韩币|krw|원/i),
        iCny = col(/人民币|cny|rmb/i), iImg = col(/^(图片|image|img)$/i);
  if (iName < 0) errors.push('「商品」表找不到「商品名」列');
  if (iKrw < 0 || iCny < 0) errors.push('「商品」表找不到「韩币」或「人民币」列');
  if (errors.length) return { errors, warns };
  const products = {};
  pr.slice(1).forEach(r => {
    const n = cell(r[iName]); if (!n) return;
    if (products[n]) return warns.push(`商品「${n}」写了两次，只用第一行`);
    const krw = num(r[iKrw]), cny = num(r[iCny]);
    if (!krw || !cny) warns.push(`商品「${n}」的价格没填全`);
    const [c1, c2] = PALETTE[Object.keys(products).length % PALETTE.length];
    const img = iImg >= 0 ? cell(r[iImg]) : '';
    products[n] = { img: !img ? '' : /^https?:/.test(img) ? img : 'images/' + img, spec: iSpec >= 0 ? cell(r[iSpec]) : '', krw, cny, c1, c2 };
  });
  if (!Object.keys(products).length) errors.push('「商品」表里没有商品');

  // 订单
  const oh = (or[0] || []).map(cell);
  const map = {}, prodCols = [], unknown = [];
  oh.forEach((h, i) => {
    if (!h) return;
    if (products[h]) return prodCols.push([i, h]);
    const k = Object.keys(ORDER_COLS).find(k => map[k] === undefined && ORDER_COLS[k].test(h));
    if (k) map[k] = i;
    else if (!IGNORE_COL.test(h)) unknown.push(h.replace(/\s+/g, ' '));
  });
  if ([map.name, map.twitter, map.email].every(x => x === undefined)) errors.push('「订单」表找不到收件人 / twitter / email 列');
  if (!prodCols.length) errors.push('「订单」表里没有和「商品」表同名的商品列');
  if (errors.length) return { errors, warns };
  if (unknown.length) warns.push(`这些列没有认出来，已忽略：${unknown.join('、')}。如果是商品，检查名字是否和「商品」表一字不差`);
  const noCol = Object.keys(products).filter(n => !prodCols.some(([, h]) => h === n));
  if (noCol.length) warns.push(`「订单」表里没有这些商品的列：${noCol.join('、')}`);
  if (map.pay === undefined) warns.push('「订单」表没有付款方式列，全部当作现场付款');

  const get = (r, k) => map[k] === undefined ? '' : cell(r[map[k]]);
  const orders = [], seen = {};
  or.slice(1).forEach((r, i) => {
    const line = i + 2;
    const name = get(r, 'name'), twitter = get(r, 'twitter').replace(/^@/, ''), email = get(r, 'email');
    const who = name || twitter || email;
    const items = [];
    prodCols.forEach(([c, n]) => {
      const v = r[c]; if (v === '' || v == null) return;
      const q = Number(v);
      if (!Number.isInteger(q) || q < 0) return warns.push(`第 ${line} 行「${n}」的数量「${v}」不是整数，已忽略`);
      if (q > 0) items.push([n, q]);
    });
    if (!who) { if (items.length) warns.push(`第 ${line} 行有商品，但没有收件人 / twitter / email，已跳过`); return; }
    if (!items.length) return warns.push(`第 ${line} 行（${who}）没有填任何商品，已跳过`);
    const payRaw = get(r, 'pay');
    let pay = '现场付款';
    if (/提前|预付/.test(payRaw)) pay = '提前转账';
    else if (!/现场|现金|微信|支付宝/.test(payRaw)) warns.push(`第 ${line} 行（${who}）付款方式「${payRaw || '空'}」看不懂，先当作现场付款`);
    // 内部编号：收件人 + twitter + email，完全一样的再加序号；同名的人不会被合并
    const key = [name, twitter, email].map(norm).join('|');
    seen[key] = (seen[key] || 0) + 1;
    orders.push({ id: key + (seen[key] > 1 ? '#' + seen[key] : ''), line, name, twitter, email, pay,
                  date: get(r, 'date'), note: get(r, 'note'), items });
  });
  if (!orders.length) errors.push('「订单」表里没有可以导入的订单');

  const byName = {};
  orders.forEach(o => { if (o.name) (byName[norm(o.name)] ||= []).push(o); });
  const dupNames = Object.values(byName).filter(a => a.length > 1).map(a => `${a[0].name} ×${a.length}`);
  return { errors, warns, products, orders, dupNames };
}

let sheetIssues = sheetCache?.warns || [];   // 表格里要检查的地方
let lastLoad = 0;
async function loadSheet() {
  if (!SHEET_API || !store.get('hf_code', '')) return;
  lastLoad = Date.now();
  try {
    const j = await GoogleBackend.call({ action: 'data' });
    const res = parseRows(j.products || [], j.orders || []);
    sheetIssues = [...res.errors, ...res.warns];
    if (res.errors.length) { renderSource(); return; }   // 表格有大问题：先继续用手机里存的那份
    const changed = JSON.stringify([res.products, res.orders]) !== JSON.stringify([PRODUCTS, ORDERS]);
    sheetCache = { products: res.products, orders: res.orders, warns: sheetIssues, at: Date.now() };
    store.set('hf_sheet_cache', sheetCache);
    if (changed) { PRODUCTS = res.products; ORDERS = res.orders; rebuild(); refreshViews(); cacheImages(); }
    renderSource();
  } catch (err) {
    if (err.badCode) showLogin('访问码已经改了，请输入新的访问码');
  }
}

function renderSource() {
  if (!SHEET_API) { $('#source').innerHTML = '数据：<b>示例数据</b>（还没连接 Google 表格）'; return; }
  $('#source').innerHTML = `数据：<b>Google 表格</b> · ${sheetCache ? '订单更新于 ' + ago(sheetCache.at) : '还没读取'}` +
    (sheetIssues.length ? ` · <button class="link warnlink" id="issues">⚠ 表格有 ${sheetIssues.length} 处要检查</button>` : '');
}
function showIssues() {
  openId = null; statsOpen = false;
  $('#sheet').innerHTML = `
    <div class="grab"></div>
    <div class="sheet-scroll">
      <div class="s-head"><div><h2>表格要检查的地方</h2><div class="sub">改好表格后，app 一分钟内会自动读到</div></div>
        <button class="x" id="close" aria-label="关闭">✕</button></div>
      <div class="alert"><ul>${sheetIssues.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>
    </div>
    <div class="s-foot"><button class="btn ghost" id="close2">关闭</button></div>`;
  $('#mask').hidden = false;
}

$('#q').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const all = document.querySelectorAll('#list .order');
  if (all.length === 1) openOrder(all[0].dataset.id);
});
$('#seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  filter = b.dataset.f; renderList();
});
$('#list').addEventListener('click', e => {
  const b = e.target.closest('.order'); if (b) openOrder(b.dataset.id);
});
$('#mask').addEventListener('click', e => { if (e.target.id === 'mask') tryClose(); });
let memoTimer = null;
function saveMemo(el) {
  clearTimeout(memoTimer);
  const oid = openId, v = el.value.trim();
  if (oid && v !== (data.memos[oid] || '')) { emit(oid, 'memo', { text: v }); commit(); }
}
$('#sheet').addEventListener('input', e => {
  if (e.target.id !== 'memo') return;
  clearTimeout(memoTimer);
  memoTimer = setTimeout(() => saveMemo(e.target), 800);
});
$('#sheet').addEventListener('focusout', e => { if (e.target.id === 'memo') saveMemo(e.target); });
$('#sheet').addEventListener('click', e => {
  const o = ORDERS.find(x => x.id === openId);
  if (e.target.closest('#close, #close2')) return openId ? tryClose() : closeOrder();
  if (e.target.closest('#finish')) return finish(o);
  const si = e.target.closest('[data-si]');
  if (si) { statsIdol = si.dataset.si; return renderStats(); }
  const sd = e.target.closest('[data-sd]');
  if (sd) { statsDate = sd.dataset.sd === 'all' ? 'all' : Number(sd.dataset.sd); $('.sheet-scroll').scrollTop = 0; return renderStats(); }
  const z = e.target.closest('[data-zoom]');
  if (z) {  // 放大看图，不改变取货状态
    const pz = PRODUCTS[z.dataset.zoom];
    $('#viewer').innerHTML = `<div>${pz?.img ? `<img class="full" src="${esc(pz.img)}" alt="">` : `<div class="big">${ph(z.dataset.zoom)}</div>`}
      <p>${esc(z.dataset.zoom)}${pz?.spec ? `<br><small>${esc(pz.spec)}</small>` : ''}</p></div>`;
    $('#viewer').hidden = false;
    return;
  }
  if (e.target.closest('#payall')) { payAllFor = o.id; return renderSheet(); }
  if (e.target.closest('#payonly')) { payAllFor = null; return renderSheet(); }
  const mi = e.target.closest('[data-mi]');
  if (mi) {
    const meth = METHODS[mi.dataset.mi], c = toCollect(o, sum(o));
    const amount = meth.cur === 'KRW' ? c.krw : c.cny;
    const money = meth.cur === 'KRW' ? won(amount) : yuan(amount);
    act(`已记录：收到${meth.key} ${money}`, () =>
      emit(o.id, 'pay', { method: meth.key, cur: meth.cur, amount, krw: c.krw, cny: c.cny }));
    payAllFor = null;
    return renderSheet();
  }
  if (e.target.closest('#unpay')) {
    const last = data.payments[o.id].at(-1);
    const was = `${last.method} ${last.cur === 'KRW' ? won(last.amount) : yuan(last.amount)}`;
    act(`已删掉付款记录：${was}`, () => emit(o.id, 'void', { ref: last.eid }));
    return renderSheet();
  }
  if (e.target.closest('#fixpick')) {
    act('已按订单数量修正', () => o.items.forEach(([n, c]) => {
      const r = data.raw[o.id]?.[n] || 0;
      if (r > c) emit(o.id, 'pick', { n, d: c - r });
    }));
    return renderSheet();
  }
  if (e.target.closest('#all')) {
    act('已全部交给客人', () => o.items.forEach(([n, c]) => setTaken(o, n, c)));
    return renderSheet();
  }
  const card = e.target.closest('.pcard'); if (!card) return;
  const [n, c] = o.items[card.dataset.i];
  const step = e.target.closest('[data-step]');
  if (step) {
    const k = taken(o, n) + Number(step.dataset.step);
    act(`${n}：已取 ${Math.max(0, Math.min(c, k))} / ${c}`, () => setTaken(o, n, k));
  }
  else if (taken(o, n) < c) act(`${n} 已取`, () => setTaken(o, n, c));
  else act(`${n} 改回未取`, () => setTaken(o, n, 0));
  renderSheet();
});
$('#viewer').addEventListener('click', () => { $('#viewer').hidden = true; });
$('#who').value = store.get('hf_who', '');
$('#who').addEventListener('input', e => store.set('hf_who', e.target.value.trim()));
$('#reset').addEventListener('click', () => {
  if (!confirm('会删掉所有取货记录，恢复成示例数据，确定吗？')) return;
  book = newBook(demoEvents()); MockBackend.reset(book.events);
  saveBook(); rebuild(); renderSource(); renderList(); renderSync();
});

// ---------- 离线 ----------
// 商品图片单独存一份，断网也能看图
function cacheImages() {
  if (!('caches' in window)) return;
  const urls = Object.values(PRODUCTS).map(p => p.img).filter(Boolean);
  caches.open('hf-images').then(c => Promise.all(urls.map(u => c.match(u).then(hit => hit || c.add(u)).catch(() => {})))).catch(() => {});
}
if ('serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  const ready = () => { offlineReady = !!navigator.serviceWorker.controller; renderSync(); };
  navigator.serviceWorker.addEventListener('controllerchange', ready);
  navigator.serviceWorker.ready.then(ready);
}
$('#sync').addEventListener('click', () => {
  sync.run();
  showToast(!window.isSecureContext ? '现在的网址不是 https，上线后才能离线打开页面'
    : offlineReady ? '页面已存进手机，没信号也能打开' : '正在把页面存进手机，稍等再看');
});
// 测试用：模拟断网
function renderMock() {
  $('#mock').textContent = `模拟断网（测试用）：${MockBackend.offline ? '开 · 现在当作没网' : '关'}`;
}
$('#mock').addEventListener('click', () => {
  MockBackend.offline = !MockBackend.offline;
  try { localStorage.setItem('hf_mock_offline', MockBackend.offline ? '1' : '0'); } catch (e) {}
  renderMock(); sync.run();
});
window.addEventListener('online', () => sync.run());
window.addEventListener('offline', () => { sync.offlineSince ||= Date.now(); renderSync(); });
setInterval(() => sync.run(), 10000);
setInterval(() => { renderSync(); renderSource(); }, 30000);

$('#demoTools').hidden = !!SHEET_API;   // 示例模式才有测试按钮
$('#logout').hidden = !SHEET_API;
rebuild();
renderSource();
renderList();
renderSync();
renderMock();
cacheImages();
if (SHEET_API && !store.get('hf_code', '')) showLogin();
else { loadSheet(); sync.run(); }
// 截图预览用：index.html#r4 直接打开该订单
if (location.hash.length > 1) openOrder(decodeURIComponent(location.hash.slice(1)));
</script>
</body>
